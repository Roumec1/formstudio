<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Forma Studio</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style id="fontfaces">@font-face {font-family: 'Bricolage Grotesque';font-style: normal;font-weight: 400 800;font-display: swap;src: url(/fonts/bricolagegrotesque-normal-latin-ext.woff2) format('woff2');unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;}@font-face {font-family: 'Bricolage Grotesque';font-style: normal;font-weight: 400 800;font-display: swap;src: url(/fonts/bricolagegrotesque-normal-latin.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}</style>
<style>
html{touch-action:manipulation}
:root{--bg:#171510;--ink:#efece4;--mid:#a8a39b;--accent:#c94e1e;--serif:'Space Grotesk',system-ui,sans-serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;text-align:center}
.wrap{max-width:520px}
.code{font-family:var(--serif);font-weight:400;font-size:7rem;line-height:1;color:var(--accent)}
.code b{color:var(--ink)}
h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:.6rem 0 1rem;line-height:1.15}
p{color:var(--mid);font-size:1rem;line-height:1.6;margin-bottom:2rem}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-size:.9rem;font-weight:500;padding:.85rem 1.7rem;border-radius:6px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,78,30,.4)}
.alt{margin-top:1.6rem;font-size:.8rem;color:var(--mid)}
.alt a{color:var(--mid);text-decoration:none;border-bottom:1px solid #3a3936;padding-bottom:1px}
.alt a:hover{color:var(--ink)}
</style>
<style id="theme-d">:root{--bg:#221b12;--ink:#fbf7ee;--mid:#b9ae9c;--accent:#f2c230;--serif:'Bricolage Grotesque',system-ui,sans-serif;--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'Bricolage Grotesque',system-ui,sans-serif}h1{font-weight:800;letter-spacing:-.04em}.code{font-weight:800}.btn{border-radius:40px;background:#6f4f82;font-weight:700}p a,li a{text-decoration:underline;text-underline-offset:2px}</style>
</head>
<body>
  <main class="wrap">
    <div class="code">4<b>0</b>4</div>
    <h1 id="t-title">Tahle stránka neexistuje</h1>
    <p id="t-body">Možná byla přesunuta nebo odkaz není správný. Vraťme se na začátek.</p>
    <a class="btn" id="t-btn" href="/">← Zpět na úvod</a>
    <p class="alt">
      <a href="/">CZ</a> · <a href="/sk">SK</a> · <a href="/en">EN</a> · <a href="/de">DE</a>
    </p>
  </main>
<script>
(function(){
  var T={
    cs:{title:'Tahle stránka neexistuje',body:'Možná byla přesunuta nebo odkaz není správný. Vraťme se na začátek.',btn:'← Zpět na úvod',home:'/'},
    sk:{title:'Táto stránka neexistuje',body:'Možno bola presunutá alebo odkaz nie je správny. Vráťme sa na začiatok.',btn:'← Späť na úvod',home:'/sk'},
    en:{title:'This page doesn’t exist',body:'It may have moved or the link is wrong. Let’s get you back on track.',btn:'← Back to home',home:'/en'},
    de:{title:'Diese Seite existiert nicht',body:'Sie wurde vielleicht verschoben oder der Link stimmt nicht. Zurück zum Anfang.',btn:'← Zurück zur Startseite',home:'/de'}
  };
  var l=(navigator.language||'cs').slice(0,2).toLowerCase();
  if(!T[l])l='cs';
  document.documentElement.lang=l;
  document.getElementById('t-title').textContent=T[l].title;
  document.getElementById('t-body').textContent=T[l].body;
  var b=document.getElementById('t-btn');
  b.textContent=T[l].btn;b.setAttribute('href',T[l].home);
})();
</script>
</body>
</html>
